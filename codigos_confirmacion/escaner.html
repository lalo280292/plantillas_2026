<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle del Invitado</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        body { font-family: sans-serif; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen p-6 flex justify-center items-start pt-10">

    <div class="w-full max-w-2xl space-y-6">

        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold text-gray-900">Detalle del Invitado</h1>
                <p class="text-gray-500 text-sm">Información registrada en Confirmación</p>
            </div>
            
            <button id="btnRefresh" onclick="fetchGuestData()" class="flex items-center gap-2 bg-blue-50 text-blue-600 border border-blue-200 px-4 py-2 rounded-lg hover:bg-blue-100 transition font-bold text-sm">
                <i id="iconRefresh" class="ph ph-arrows-clockwise text-xl"></i> 
                <span id="textRefresh">Actualizar Datos</span>
            </button>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
            <div class="bg-gray-50 px-6 py-4 border-b border-gray-200 flex justify-between items-center">
                <span class="text-xs font-bold text-gray-400 uppercase tracking-wider">ID: <span id="displayID" class="text-gray-600 font-mono text-sm ml-1">...</span></span>
                <span id="statusBadge" class="px-3 py-1 rounded-full text-xs font-bold bg-gray-200 text-gray-600">Cargando...</span>
            </div>

            <div id="content" class="p-6">
                <div class="text-center py-12 text-gray-400">
                    <i class="ph ph-spinner animate-spin text-4xl mb-3 block mx-auto"></i>
                    Buscando información...
                </div>
            </div>
        </div>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', fetchGuestData);

        async function fetchGuestData() {
            // 1. Obtener ID de la URL
            const urlParams = new URLSearchParams(window.location.search);
            const guestId = urlParams.get('id');

            // --- UI: ACTIVAR ANIMACIÓN ---
            const btn = document.getElementById('btnRefresh');
            const icon = document.getElementById('iconRefresh');
            const text = document.getElementById('textRefresh');
            
            icon.classList.add('animate-spin');
            text.innerText = "Cargando...";
            btn.disabled = true;
            btn.classList.add('opacity-75', 'cursor-not-allowed');

            const contentDiv = document.getElementById('content');

            if (!guestId) {
                renderError("No se especificó un ID en el enlace.");
                stopAnimation(btn, icon, text);
                return;
            }

            document.getElementById('displayID').textContent = guestId;

            try {
                // 2. Fetch al Proxy
                const response = await fetch('proxy.php?method=read&sheet=Confirmacion&t=' + new Date().getTime());
                
                if (!response.ok) throw new Error("Error de conexión.");

                const data = await response.json();

                // 3. Buscar invitado
                const guest = data.find(item => String(item.id).trim() === String(guestId).trim());

                if (guest) {
                    renderGuestDetails(guest);
                } else {
                    renderError(`No se encontró el ID: ${guestId}`);
                    document.getElementById('statusBadge').className = "px-3 py-1 rounded-full text-xs font-bold bg-gray-200 text-gray-500";
                    document.getElementById('statusBadge').innerText = "No Encontrado";
                }

            } catch (error) {
                console.error(error);
                renderError("Error al cargar: " + error.message);
            } finally {
                // --- UI: DETENER ANIMACIÓN ---
                stopAnimation(btn, icon, text);
            }
        }

        function renderGuestDetails(guest) {
            const contentDiv = document.getElementById('content');
            contentDiv.innerHTML = ''; // Limpiar

            // Definir campos ocultos
            const hiddenFields = ['qr', 'columna_L', 'id']; 

            // Actualizar Badge de Estado en la esquina
            updateStatusBadge(guest.asistira);

            // Crear Grid de datos
            const grid = document.createElement('div');
            grid.className = "grid grid-cols-1 md:grid-cols-2 gap-6";

            // Ordenar claves para que 'familia' salga primero si es posible, o dejarlas como vienen
            // Aquí iteramos sobre las claves del objeto
            for (const [key, value] of Object.entries(guest)) {
                
                // Filtro: Ocultar QR y vacíos
                if (hiddenFields.includes(key.toLowerCase())) continue;
                if (!value || value === "") continue;

                const item = document.createElement('div');
                item.className = "border-b border-gray-100 pb-2";

                // Formatear Título (ej: cantidad_adultos -> Cantidad Adultos)
                const labelText = key.replace(/_/g, ' ').replace(/([A-Z])/g, ' $1').trim();
                
                const label = document.createElement('p');
                label.className = "text-xs font-bold text-gray-400 uppercase mb-1";
                label.textContent = labelText;

                const val = document.createElement('p');
                val.className = "text-lg font-medium text-gray-800 break-words";
                val.textContent = value;

                // Estilo especial si es el mensaje
                if(key.toLowerCase() === 'mensaje' || key.toLowerCase().includes('nombres')) {
                    item.className = "md:col-span-2 bg-gray-50 p-4 rounded-lg border border-gray-100";
                    val.className = "text-md text-gray-600 italic";
                }

                item.appendChild(label);
                item.appendChild(val);
                grid.appendChild(item);
            }

            contentDiv.appendChild(grid);
        }

        function updateStatusBadge(statusRaw) {
            const badge = document.getElementById('statusBadge');
            const status = (statusRaw || '').toLowerCase();

            if (status === 'si' || status === 'sí') {
                badge.className = "px-3 py-1 rounded-full text-xs font-bold bg-green-100 text-green-700 border border-green-200 flex items-center gap-1";
                badge.innerHTML = '<i class="ph ph-check-circle-fill"></i> Confirmado';
            } else if (status === 'no') {
                badge.className = "px-3 py-1 rounded-full text-xs font-bold bg-red-100 text-red-700 border border-red-200 flex items-center gap-1";
                badge.innerHTML = '<i class="ph ph-x-circle-fill"></i> No Asistirá';
            } else {
                badge.className = "px-3 py-1 rounded-full text-xs font-bold bg-yellow-100 text-yellow-700 border border-yellow-200";
                badge.innerText = status || 'Pendiente';
            }
        }

        function renderError(msg) {
            const contentDiv = document.getElementById('content');
            contentDiv.innerHTML = `
                <div class="flex flex-col items-center justify-center py-8 text-center">
                    <div class="bg-red-100 p-4 rounded-full mb-4">
                        <i class="ph ph-warning text-3xl text-red-500"></i>
                    </div>
                    <h3 class="text-lg font-bold text-gray-900 mb-1">Algo salió mal</h3>
                    <p class="text-gray-500 max-w-xs mx-auto">${msg}</p>
                </div>
            `;
        }

        function stopAnimation(btn, icon, text) {
            if(btn && icon && text) {
                icon.classList.remove('animate-spin');
                text.innerText = "Actualizar Datos";
                btn.disabled = false;
                btn.classList.remove('opacity-75', 'cursor-not-allowed');
            }
        }
    </script>
</body>
</html>
