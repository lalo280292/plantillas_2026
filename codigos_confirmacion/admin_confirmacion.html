<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmaciones</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="admin.js"></script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800">
<div class="max-w-7xl mx-auto p-4 md:p-6 space-y-4">

    <header class="bg-white rounded-xl shadow-sm p-4 flex flex-col md:flex-row md:items-center justify-between gap-3">
        <div>
            <h1 class="text-2xl font-bold flex items-center gap-2"><i class="ph ph-check-circle text-emerald-600"></i> Confirmaciones</h1>
            <p class="text-sm text-gray-500">Respuestas de los invitados (sustituye la hoja "Confirmacion")</p>
        </div>
        <nav class="flex flex-wrap gap-2 text-sm">
            <a href="admin_lista.html" class="px-3 py-2 rounded-lg bg-indigo-50 text-indigo-700 border border-indigo-200 font-bold flex items-center gap-1"><i class="ph ph-users-three"></i> Lista</a>
            <a href="panel.html" class="px-3 py-2 rounded-lg bg-gray-50 border font-bold flex items-center gap-1"><i class="ph ph-squares-four"></i> Panel</a>
            <button onclick="logout()" class="px-3 py-2 rounded-lg bg-gray-50 border font-bold flex items-center gap-1"><i class="ph ph-sign-out"></i> Salir</button>
        </nav>
    </header>

    <section class="grid grid-cols-2 md:grid-cols-6 gap-3" id="stats"></section>

    <section class="bg-white rounded-xl shadow-sm p-4 flex flex-col md:flex-row gap-3 md:items-center justify-between">
        <div class="flex flex-col md:flex-row gap-2 w-full md:w-auto">
            <input id="buscar" oninput="render()" placeholder="Buscar familia, nombres o ID..." class="border rounded-lg px-3 py-2 w-full md:w-80">
            <select id="filtro" onchange="render()" class="border rounded-lg px-3 py-2">
                <option value="">Todos</option>
                <option value="si">Asistirán</option>
                <option value="no">No asistirán</option>
                <option value="pendiente">Sin responder</option>
            </select>
        </div>
        <div class="flex gap-2">
            <button onclick="abrirModal()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-4 py-2 rounded-lg flex items-center gap-1"><i class="ph ph-plus"></i> Registrar manual</button>
            <button onclick="exportar()" class="bg-gray-50 border font-bold px-4 py-2 rounded-lg flex items-center gap-1"><i class="ph ph-download-simple"></i> CSV</button>
        </div>
    </section>

    <section class="bg-white rounded-xl shadow-sm overflow-x-auto">
        <table class="w-full text-sm">
            <thead class="bg-gray-50 text-gray-500 uppercase text-xs">
                <tr>
                    <th class="px-3 py-3 text-left">Fecha</th>
                    <th class="px-3 py-3 text-left">ID</th>
                    <th class="px-3 py-3 text-left">Familia</th>
                    <th class="px-3 py-3">Asistirá</th>
                    <th class="px-3 py-3">Total</th>
                    <th class="px-3 py-3">Adul.</th>
                    <th class="px-3 py-3">Adol.</th>
                    <th class="px-3 py-3">Niñ.</th>
                    <th class="px-3 py-3 text-left">Nombres</th>
                    <th class="px-3 py-3 text-left">Mensaje</th>
                    <th class="px-3 py-3">Mesa</th>
                    <th class="px-3 py-3">Acciones</th>
                </tr>
            </thead>
            <tbody id="tabla" class="divide-y"></tbody>
        </table>
    </section>
</div>

<!-- Modal confirmación -->
<div id="modal" class="fixed inset-0 bg-gray-900/60 hidden items-center justify-center z-40 p-4">
    <form id="formConf" class="bg-white rounded-xl shadow-xl p-6 w-full max-w-lg space-y-3 max-h-full overflow-y-auto">
        <h2 id="modalTitulo" class="text-lg font-bold"></h2>
        <label class="block text-sm font-bold">Invitado
            <select name="id" required class="mt-1 w-full border rounded-lg px-3 py-2 font-normal"></select>
        </label>
        <div class="flex gap-4 text-sm font-bold">
            <label class="flex items-center gap-1"><input type="radio" name="asistira" value="Si" required> Sí asistirá</label>
            <label class="flex items-center gap-1"><input type="radio" name="asistira" value="No"> No asistirá</label>
        </div>
        <div class="grid grid-cols-4 gap-3">
            <label class="block text-sm font-bold">Total <input name="cantidad" type="number" min="0" class="mt-1 w-full border rounded-lg px-2 py-2 font-normal"></label>
            <label class="block text-sm font-bold">Adul. <input name="adultos" type="number" min="0" class="mt-1 w-full border rounded-lg px-2 py-2 font-normal"></label>
            <label class="block text-sm font-bold">Adol. <input name="adolescentes" type="number" min="0" class="mt-1 w-full border rounded-lg px-2 py-2 font-normal"></label>
            <label class="block text-sm font-bold">Niños <input name="ninos" type="number" min="0" class="mt-1 w-full border rounded-lg px-2 py-2 font-normal"></label>
        </div>
        <p id="limite" class="text-xs text-gray-400"></p>
        <label class="block text-sm font-bold">Nombres de asistentes
            <textarea name="nombres" rows="2" class="mt-1 w-full border rounded-lg px-3 py-2 font-normal"></textarea>
        </label>
        <label class="block text-sm font-bold">Felicitaciones / comentarios
            <textarea name="felicitaciones" rows="3" class="mt-1 w-full border rounded-lg px-3 py-2 font-normal"></textarea>
        </label>
        <p class="text-xs text-gray-400">La mesa se asigna desde la Lista de invitados.</p>
        <div class="flex justify-end gap-2 pt-2">
            <button type="button" onclick="cerrarModal()" class="px-4 py-2 rounded-lg border font-bold">Cancelar</button>
            <button class="px-4 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white font-bold">Guardar</button>
        </div>
    </form>
</div>

<script>
let lista = [];
let confs = [];

const esSi = c => String(c.asistira || '').toLowerCase().startsWith('s');

async function onLogin() {
    try {
        [lista, confs] = await Promise.all([api('lista'), api('confirmacion')]);
        render();
    } catch (e) { alert(e.message); }
}

function render() {
    const q = document.getElementById('buscar').value.toLowerCase();
    const filtro = document.getElementById('filtro').value;
    const respondidos = new Set(confs.map(c => String(c.id)));

    // Filas: confirmaciones + (si aplica) invitados que no han respondido
    let filas = confs.map(c => ({ ...c, _tipo: esSi(c) ? 'si' : 'no' }));
    const pendientes = lista.filter(r => !respondidos.has(r.ID))
        .map(r => ({ id: r.ID, familia: r.Familia, nombres: r.Nombres, mesa: r.Mesa, _tipo: 'pendiente' }));
    filas = filtro === 'pendiente' ? pendientes : filas.filter(f => !filtro || f._tipo === filtro);
    if (!filtro) filas = filas.concat(pendientes);
    filas = filas.filter(f => [f.id, f.familia, f.nombres].join(' ').toLowerCase().includes(q));
    filas.sort((a, b) => String(b.fecha || '').localeCompare(String(a.fecha || '')));

    const si = confs.filter(esSi);
    const suma = k => si.reduce((t, c) => t + (parseInt(c[k]) || 0), 0);
    const stat = (t, v, color) => `<div class="bg-white rounded-xl shadow-sm p-4"><p class="text-xs uppercase font-bold text-gray-400">${t}</p><p class="text-2xl font-bold ${color}">${v}</p></div>`;
    document.getElementById('stats').innerHTML =
        stat('Personas confirmadas', suma('cantidad'), 'text-green-600') +
        stat('Adultos', suma('adultos'), 'text-gray-700') +
        stat('Adolescentes', suma('adolescentes'), 'text-gray-700') +
        stat('Niños', suma('ninos'), 'text-gray-700') +
        stat('No asistirán', confs.length - si.length, 'text-red-600') +
        stat('Sin responder', pendientes.length, 'text-yellow-600');

    const badge = {
        si: '<span class="px-2 py-0.5 rounded-full text-xs font-bold bg-green-100 text-green-700">Sí</span>',
        no: '<span class="px-2 py-0.5 rounded-full text-xs font-bold bg-red-100 text-red-700">No</span>',
        pendiente: '<span class="px-2 py-0.5 rounded-full text-xs font-bold bg-yellow-100 text-yellow-700">Pendiente</span>'
    };
    const tbody = document.getElementById('tabla');
    if (!filas.length) {
        tbody.innerHTML = '<tr><td colspan="12" class="text-center py-6 text-gray-400">Sin registros.</td></tr>';
        return;
    }
    tbody.innerHTML = filas.map(f => `
        <tr class="hover:bg-gray-50 ${f._tipo === 'pendiente' ? 'text-gray-400' : ''}">
            <td class="px-3 py-2 text-xs whitespace-nowrap">${esc(f.fecha || '')}</td>
            <td class="px-3 py-2 font-mono text-xs">${esc(f.id)}</td>
            <td class="px-3 py-2 font-medium">${esc(f.familia)}</td>
            <td class="px-3 py-2 text-center">${badge[f._tipo]}</td>
            <td class="px-3 py-2 text-center font-bold">${esc(f.cantidad ?? '')}</td>
            <td class="px-3 py-2 text-center">${esc(f.adultos ?? '')}</td>
            <td class="px-3 py-2 text-center">${esc(f.adolescentes ?? '')}</td>
            <td class="px-3 py-2 text-center">${esc(f.ninos ?? '')}</td>
            <td class="px-3 py-2 text-xs max-w-[12rem] truncate" title="${esc(f.nombres)}">${esc(f.nombres)}</td>
            <td class="px-3 py-2 text-xs max-w-[14rem] truncate" title="${esc(f.felicitaciones)}">${esc(f.felicitaciones || '')}</td>
            <td class="px-3 py-2 text-center">${esc(f.mesa) || '-'}</td>
            <td class="px-3 py-2">
                <div class="flex justify-center gap-1 text-lg">
                    <button title="${f._tipo === 'pendiente' ? 'Registrar respuesta' : 'Editar'}" onclick="abrirModal('${esc(f.id)}')" class="p-1 text-indigo-600 hover:bg-indigo-50 rounded"><i class="ph ${f._tipo === 'pendiente' ? 'ph-plus-circle' : 'ph-pencil-simple'}"></i></button>
                    ${f._tipo === 'si' ? `<a title="Ver pase QR" target="_blank" href="${esc(f.qr)}" class="p-1 text-gray-600 hover:bg-gray-100 rounded"><i class="ph ph-qr-code"></i></a>` : ''}
                    ${f._tipo !== 'pendiente' ? `<button title="Eliminar respuesta" onclick="eliminar('${esc(f.id)}')" class="p-1 text-red-600 hover:bg-red-50 rounded"><i class="ph ph-trash"></i></button>` : ''}
                </div>
            </td>
        </tr>`).join('');
}

const modal = document.getElementById('modal');
const form = document.getElementById('formConf');

function mostrarLimite() {
    const r = lista.find(x => x.ID === form.elements.id.value);
    document.getElementById('limite').textContent = r
        ? `Lugares asignados: ${r.Invitados} (Adultos ${r.Adultos}, Adolescentes ${r.Adolescentes}, Niños ${r.Ninos})` : '';
}
form.elements.id.addEventListener('change', mostrarLimite);

function abrirModal(id) {
    form.reset();
    const c = confs.find(x => String(x.id) === id);
    form.elements.id.innerHTML = lista.map(r => `<option value="${esc(r.ID)}">${esc(r.Familia)} (${esc(r.ID)})</option>`).join('');
    form.elements.id.disabled = !!id;
    document.getElementById('modalTitulo').textContent = c ? `Editar confirmación (${c.id})` : 'Registrar confirmación';
    if (id) form.elements.id.value = id;
    if (c) {
        form.querySelector(`input[name="asistira"][value="${esSi(c) ? 'Si' : 'No'}"]`).checked = true;
        ['cantidad', 'adultos', 'adolescentes', 'ninos', 'nombres', 'felicitaciones'].forEach(k => form[k].value = c[k] ?? '');
    }
    mostrarLimite();
    modal.classList.replace('hidden', 'flex');
}
function cerrarModal() { modal.classList.replace('flex', 'hidden'); }

form.addEventListener('submit', async e => {
    e.preventDefault();
    form.elements.id.disabled = false;
    const d = Object.fromEntries(new FormData(form));
    ['cantidad', 'adultos', 'adolescentes', 'ninos'].forEach(k => d[k] = d.asistira === 'No' ? 0 : (parseInt(d[k]) || 0));
    try {
        await api('guardarConfirmacion', d);
        cerrarModal();
        onLogin();
    } catch (err) { alert(err.message); }
});

async function eliminar(id) {
    if (!confirm('¿Eliminar esta respuesta? El invitado volverá a quedar como pendiente.')) return;
    try { await api('eliminarConfirmacion', { id }); onLogin(); } catch (err) { alert(err.message); }
}

function exportar() {
    descargarCSV('confirmaciones.csv',
        ['fecha', 'id', 'familia', 'asistira', 'cantidad', 'adultos', 'adolescentes', 'ninos', 'nombres', 'felicitaciones', 'mesa', 'qr'], confs);
}
</script>
</body>
</html>
