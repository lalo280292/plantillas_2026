<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle del Invitado</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        body { font-family: sans-serif; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen p-6 flex justify-center items-start pt-10">

    <div class="w-full max-w-2xl space-y-6">

        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold text-gray-900">Detalle del Invitado</h1>
                <p class="text-gray-500 text-sm">Información registrada en la confirmación</p>
            </div>

            <button id="btnRefresh" onclick="fetchGuestData()" class="flex items-center gap-2 bg-blue-50 text-blue-600 border border-blue-200 px-4 py-2 rounded-lg hover:bg-blue-100 transition font-bold text-sm">
                <i id="iconRefresh" class="ph ph-arrows-clockwise text-xl"></i>
                <span id="textRefresh">Actualizar Datos</span>
            </button>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
            <div class="bg-gray-50 px-6 py-4 border-b border-gray-200 flex justify-between items-center">
                <span class="text-xs font-bold text-gray-400 uppercase tracking-wider">ID: <span id="displayID" class="text-gray-600 font-mono text-sm ml-1">...</span></span>
                <span id="statusBadge" class="px-3 py-1 rounded-full text-xs font-bold bg-gray-200 text-gray-600">Cargando...</span>
            </div>

            <div id="content" class="p-6">
                <div class="text-center py-12 text-gray-400">
                    <i class="ph ph-spinner animate-spin text-4xl mb-3 block mx-auto"></i>
                    Buscando información...
                </div>
            </div>
        </div>

    </div>

    <script>
        // Campos de confirmados.json que se muestran y su etiqueta
        const CAMPOS = [
            { key: 'familia',      label: 'Familia',            ancho: true },
            { key: 'cantidad',     label: 'Total de personas' },
            { key: 'adultos',      label: 'Adultos' },
            { key: 'adolescentes', label: 'Adolescentes' },
            { key: 'ninos',        label: 'Niños' },
            { key: 'nombres',      label: 'Nombres de los asistentes', ancho: true, especial: true },
            { key: 'fecha',        label: 'Confirmó el', fecha: true },
        ];

        document.addEventListener('DOMContentLoaded', fetchGuestData);

        async function fetchGuestData() {
            const guestId = new URLSearchParams(window.location.search).get('id');

            const btn = document.getElementById('btnRefresh');
            const icon = document.getElementById('iconRefresh');
            const text = document.getElementById('textRefresh');
            icon.classList.add('animate-spin');
            text.innerText = "Cargando...";
            btn.disabled = true;
            btn.classList.add('opacity-75', 'cursor-not-allowed');

            try {
                if (!guestId) {
                    renderError("No se especificó un ID en el enlace.");
                    setBadge('gray', 'Sin ID');
                    return;
                }
                document.getElementById('displayID').textContent = guestId;

                const response = await fetch(`api.php?accion=confirmacion&id=${encodeURIComponent(guestId)}&t=${Date.now()}`, { cache: 'no-store' });
                const data = await response.json().catch(() => ({ ok: false, error: 'Error de conexión.' }));

                if (data.ok) {
                    renderGuestDetails(data.confirmacion);
                } else if (response.status === 404) {
                    renderError(data.error || `No se encontró el ID: ${guestId}`);
                    setBadge('gray', 'No Encontrado');
                } else {
                    throw new Error(data.error || 'Error de conexión.');
                }
            } catch (error) {
                console.error(error);
                renderError("Error al cargar: " + error.message);
                setBadge('gray', 'Error');
            } finally {
                icon.classList.remove('animate-spin');
                text.innerText = "Actualizar Datos";
                btn.disabled = false;
                btn.classList.remove('opacity-75', 'cursor-not-allowed');
            }
        }

        function renderGuestDetails(guest) {
            const contentDiv = document.getElementById('content');
            contentDiv.innerHTML = '';
            updateStatusBadge(guest.asistira);

            // La mesa se muestra en grande: es lo primero que se busca en la entrada
            if (guest.asistira === 'Si') {
                const mesa = document.createElement('div');
                mesa.className = "mb-6 rounded-xl p-5 text-center " + (guest.mesa ? "bg-indigo-50 border border-indigo-100" : "bg-yellow-50 border border-yellow-200");
                const etiqueta = document.createElement('p');
                etiqueta.className = "text-xs font-bold uppercase tracking-wider " + (guest.mesa ? "text-indigo-400" : "text-yellow-600");
                etiqueta.textContent = 'Mesa';
                const valor = document.createElement('p');
                valor.className = "text-5xl font-extrabold " + (guest.mesa ? "text-indigo-700" : "text-yellow-700 text-2xl");
                valor.textContent = guest.mesa || 'Sin mesa asignada';
                mesa.append(etiqueta, valor);
                contentDiv.appendChild(mesa);
            }

            const grid = document.createElement('div');
            grid.className = "grid grid-cols-1 md:grid-cols-2 gap-6";

            CAMPOS.forEach(campo => {
                let value = guest[campo.key];
                if (value === undefined || value === null || value === '' || (typeof value === 'number' && value === 0 && campo.key !== 'cantidad')) return;
                if (guest.asistira !== 'Si' && campo.key !== 'familia' && campo.key !== 'fecha') return;
                if (campo.fecha) value = formatearFecha(value);

                const item = document.createElement('div');
                item.className = "border-b border-gray-100 pb-2" + (campo.ancho ? " md:col-span-2" : "");

                const label = document.createElement('p');
                label.className = "text-xs font-bold text-gray-400 uppercase mb-1";
                label.textContent = campo.label;

                const val = document.createElement('p');
                val.className = "text-lg font-medium text-gray-800 break-words";
                val.textContent = value;

                if (campo.especial) {
                    item.className = "md:col-span-2 bg-gray-50 p-4 rounded-lg border border-gray-100";
                    val.className = "text-md text-gray-600 italic whitespace-pre-line";
                }

                item.append(label, val);
                grid.appendChild(item);
            });

            contentDiv.appendChild(grid);
        }

        function formatearFecha(valor) {
            const d = new Date(String(valor).replace(' ', 'T'));
            return isNaN(d) ? valor : d.toLocaleString('es-MX', { dateStyle: 'long', timeStyle: 'short' });
        }

        function updateStatusBadge(statusRaw) {
            const status = (statusRaw || '').toLowerCase();
            if (status === 'si' || status === 'sí') setBadge('green', '<i class="ph ph-check-circle-fill"></i> Confirmado', true);
            else if (status === 'no') setBadge('red', '<i class="ph ph-x-circle-fill"></i> No Asistirá', true);
            else setBadge('yellow', status || 'Pendiente');
        }

        function setBadge(color, contenido, esHtml = false) {
            const badge = document.getElementById('statusBadge');
            const estilos = {
                green: 'bg-green-100 text-green-700 border border-green-200',
                red: 'bg-red-100 text-red-700 border border-red-200',
                yellow: 'bg-yellow-100 text-yellow-700 border border-yellow-200',
                gray: 'bg-gray-200 text-gray-500',
            };
            badge.className = `px-3 py-1 rounded-full text-xs font-bold flex items-center gap-1 ${estilos[color]}`;
            if (esHtml) badge.innerHTML = contenido; else badge.textContent = contenido;
        }

        function renderError(msg) {
            const contentDiv = document.getElementById('content');
            contentDiv.innerHTML = `
                <div class="flex flex-col items-center justify-center py-8 text-center">
                    <div class="bg-red-100 p-4 rounded-full mb-4">
                        <i class="ph ph-warning text-3xl text-red-500"></i>
                    </div>
                    <h3 class="text-lg font-bold text-gray-900 mb-1">Algo salió mal</h3>
                    <p class="text-gray-500 max-w-xs mx-auto" id="errorMsg"></p>
                </div>`;
            document.getElementById('errorMsg').textContent = msg; // textContent: el ID viene de la URL
        }
    </script>
</body>
</html>
