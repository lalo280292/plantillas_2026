<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Control de Visibilidad del Formulario</title>
    <!-- Añadir meta viewport para hacer la página responsiva -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Estilos CSS -->
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 500px;
            margin: 50px auto; /* Centrar horizontalmente y agregar espacio superior */
            background-color: #fff;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        
        h1 {
            text-align: center;
            color: #333;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 30px;
        }

        .button-group button {
            padding: 15px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            color: #fff;
        }

        .button-group button.activate {
            background-color: #28a745;
        }

        .button-group button.deactivate {
            background-color: #dc3545;
        }

        /* Estilos para pantallas pequeñas */
        @media (max-width: 600px) {
            .container {
                margin: 20px;
            }

            h1 {
                font-size: 24px;
            }

            .button-group button {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Control de Visibilidad del Formulario</h1>
        <div class="button-group">
            <button class="activate" onclick="setFormVisibility(true)">Mostrar Formulario</button>
            <button class="deactivate" onclick="setFormVisibility(false)">Ocultar Formulario</button>
        </div>
    </div>

    <script>
        function setFormVisibility(visible) {
            var xhr = new XMLHttpRequest();
            xhr.open('GET', 'control.php?action=set&visible=' + visible, true);
            xhr.onload = function () {
                if (xhr.status === 200) {
                    alert(xhr.responseText);
                } else {
                    alert('Error al cambiar el estado de visibilidad.');
                }
            };
            xhr.send();
        }
    </script>
</body>
</html>
